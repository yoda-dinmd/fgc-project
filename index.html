<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Light</title><link rel="stylesheet" href="style.css"><script defer src="story.js"></script><script defer src="locales.js"></script><script defer src="game.js"></script></head>
<body><header><a href="./" data-i18n="brand">THE LAST LIGHT</a><span data-i18n="subtitle"></span><div class="headerActions"><select class="language" data-label="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="ro">Română</option></select><button id="journalBtn"><span data-i18n="journal"></span> <span id="count">0/8</span></button></div></header>
<main><section class="intro"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="heading"></h1></div><div class="introCopy"><p data-i18n="summary"></p><button id="storyBtn" data-i18n="replay"></button></div></section>
<section class="game" data-label="mapLabel"><div class="mapbar"><span><span data-i18n="town"></span> <small data-i18n="night"></small></span><span id="progress"></span></div><canvas id="world" width="960" height="480" tabindex="0" data-label="mapLabel"></canvas><div class="mapfoot"><span><kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> <span data-i18n="move"></span> &nbsp; <kbd>E</kbd> <span data-i18n="talk"></span></span><button id="beacon" data-i18n="visit"></button></div></section>
<section class="people" data-label="peopleLabel"></section><footer><span data-i18n="footer"></span><span data-i18n="vote"></span></footer></main>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialogTop"><span id="speaker"></span><select class="language" data-label="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="ro">Română</option></select><button id="close" data-label="close" aria-label="Close dialog">✕</button></div><div id="body"></div></dialog>
</body></html>
